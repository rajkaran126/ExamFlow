# Google Cloud Build Pipeline for EXAMFLOW AI (Cloud Run Deployment)
steps:
  # 1. Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/examflow-ai:$COMMIT_SHA', '-f', 'Dockerfile', '.']

  # 2. Push to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/examflow-ai:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'examflow-ai-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/examflow-ai:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,LLAMA_MODEL_ID=llama-3.3-70b-versatile'

images:
  - 'gcr.io/$PROJECT_ID/examflow-ai:$COMMIT_SHA'
