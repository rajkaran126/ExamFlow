version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: examflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: examflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examflow-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/examflow
      SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/examflow
      SECRET_KEY: examflow-production-secret-key-2024
      ENVIRONMENT: production
    ports:
      - "8080:8080"
    depends_on:
      - db

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: examflow-ai-agent
    restart: always
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      ENVIRONMENT: production
      BACKEND_API_BASE_URL: http://backend:8080/api
    ports:
      - "8001:8080"
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examflow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
      - ai-agent

volumes:
  pgdata:
